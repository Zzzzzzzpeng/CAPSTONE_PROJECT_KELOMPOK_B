<div
    id="toast"
    class="toast"
></div>


<script src="../../js/auth.js"></script>

<script>

const tbody =
    document.getElementById(
        "deathTable"
    );


function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll(
            "'",
            "&#039;"
        );
}


function formatTanggal(value) {

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "-";
    }

    return date.toLocaleString(
        "id-ID",
        {
            day: "numeric",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


async function loadDeathHistory() {

    try {

        const response =
            await fetch(
                "/api/kematian",
                {
                    credentials:
                        "same-origin",
                    cache: "no-store"
                }
            );

        const data =
            await response
                .json()
                .catch(() => []);

        if (!response.ok) {

            throw new Error(
                data.error ||
                `HTTP ${response.status}`
            );
        }


        if (!data.length) {

            tbody.innerHTML = `
                <tr>
                    <td
                        colspan="4"
                        style="text-align:center"
                    >
                        Belum ada riwayat kematian.
                    </td>
                </tr>
            `;

            return;
        }


        tbody.innerHTML =
            data.map(item => `

                <tr>

                    <td>
                        ${escapeHTML(
                            formatTanggal(
                                item.tanggal
                            )
                        )}
                    </td>

                    <td>
                        <strong>
                            ${escapeHTML(
                                item.namaIkan
                            )}
                        </strong>
                    </td>

                    <td>
                        <span
                            class="badge badge-danger"
                        >
                            ${escapeHTML(
                                item.jumlah
                            )}
                            ekor
                        </span>
                    </td>

                    <td>
                        ${escapeHTML(
                            item.keterangan
                        )}
                    </td>

                </tr>

            `).join("");

    } catch (error) {

        console.error(
            "Gagal mengambil riwayat kematian:",
            error
        );

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="4"
                    style="
                        text-align:center;
                        color:var(--bad);
                        padding:30px;
                    "
                >
                    ⚠️ ${escapeHTML(
                        error.message
                    )}
                </td>
            </tr>
        `;
    }
}


loadDeathHistory();

</script>
